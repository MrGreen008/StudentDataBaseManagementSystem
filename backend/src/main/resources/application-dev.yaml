spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vishvaya_students}
    username: ${POSTGRES_USER:vishvaya_app}
    password: ${POSTGRES_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    edu.vishvaya.portal: INFO
