name: vishvaya-student-system

services:
  web:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vishvaya-web
    restart: unless-stopped
    environment:
      PORT: 8080
      PORTAL_BOOTSTRAP_LOGIN: ${PORTAL_BOOTSTRAP_LOGIN:-}
      PORTAL_BOOTSTRAP_PASSWORD: ${PORTAL_BOOTSTRAP_PASSWORD:-}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vishvaya_students}
      POSTGRES_USER: ${POSTGRES_USER:-vishvaya_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the local .env file}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: vishvaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vishvaya_students}
      POSTGRES_USER: ${POSTGRES_USER:-vishvaya_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: vishvaya-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the local .env file}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
